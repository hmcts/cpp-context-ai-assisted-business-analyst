name: CI Build and Publish

on:
  workflow_call:
    secrets:
      HMCTS_ADO_PAT:
        required: true
    inputs:
      environment:
        required: true
        type: string
        default: dev
      is_release:
        required: false
        type: boolean
        default: false
      trigger_docker:
        required: true
        type: boolean
      trigger_deploy:
        required: true
        type: boolean

jobs:
  Artefact-Version:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    outputs:
      artefact_version: ${{ steps.version.outputs.artefact_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate Artefact Version
        id: artefact
        uses: hmcts/artefact-version-action@43882bf28ee97522e5547cc5e621b2f9e7521b44 # v1
        with:
          release: ${{ inputs.is_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same branch rules as service-cp-crime-hearing-results-validator.
      # Release builds keep the action's tag-derived release_version.
      # team/** -> <branch-name-without-team/>-<short-sha>
      # main / other -> <package.json version>-<short-sha>
      - name: Resolve artefact version
        id: version
        env:
          IS_RELEASE: ${{ inputs.is_release }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.artefact.outputs.release_version }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="$RELEASE_VERSION"
          elif [[ "$REF_NAME" == team/* ]]; then
            BRANCH="${REF_NAME#team/}"
            BRANCH="${BRANCH//\//-}"
            VERSION="${BRANCH}-${SHORT_SHA}"
          else
            PROJECT_VERSION="$(node -p "require('./package.json').version")"
            VERSION="${PROJECT_VERSION}-${SHORT_SHA}"
          fi
          echo "Resolved artefact version: $VERSION"
          echo "artefact_version=$VERSION" >> "$GITHUB_OUTPUT"

  Test:
    needs: [Artefact-Version]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test
        run: |
          npm install
          npm test

  Build-Docker:
    needs: [Test, Artefact-Version]
    if: ${{ inputs.trigger_docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GitHub Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GitHub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.Artefact-Version.outputs.artefact_version }}

      - name: Run Trivy vulnerability scan
        if: false # re-enable when the sigstore image fix is in place
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.Artefact-Version.outputs.artefact_version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  Deploy:
    needs: [Build-Docker, Artefact-Version]
    if: ${{ inputs.trigger_deploy && (needs.Build-Docker.result == 'success' || needs.Build-Docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Trigger ADO pipeline
        uses: hmcts/trigger-ado-pipeline@5ded370558d366e7de23d69956a76e012220435d # v2
        with:
          pipeline_id: 460
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          template_parameters: >
            {
              "GROUP_ID": "uk.gov.hmcts.cp",
              "ARTIFACT_ID": "${{ env.REPO_NAME }}",
              "ARTIFACT_VERSION": "${{ needs.Artefact-Version.outputs.artefact_version }}",
              "TARGET_REPOSITORY": "${{ github.repository }}",
              "agentDemand": "ubuntu-j25",
              "publishMode": "image"
            }
